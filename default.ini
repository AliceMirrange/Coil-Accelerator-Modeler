; Restart the builder after editing this file.
; Every initial value shown in an editable GUI control is configured here.

[gui_defaults]
; {timestamp} is replaced with YYYYMMDD_HHMMSS on the first launch.
project_filename = LinearAccelerator_{timestamp}.aedt
; Updated automatically when the main window closes. Leave blank for first-launch behavior.
last_project_path = E:\Ansys\Maxwell\LinearAcceleratorGenerator\LinearAccelerator31.aedt
maxwell_design = LinearAccelerator2D
circuit_design = AcceleratorExternalCircuit
; Leave blank to let PyAEDT select the installed AEDT version.
aedt_version =
non_graphical = false
delete_existing_circuit = true
coil_count = 10
; Supported values: common, independent.
inner_mode = common
gap_mode = common
; Supported values: reluctance, induction.
position_mode = reluctance
common_inner_diameter = 20
common_gap = 5
coil_inner_diameter = 10
coil_outer_diameter = 30
coil_length = 20
coil_turns = 150
coil_fill_factor = 0.65
coil_material = 铜
coil_gap = 2.5
; When enabled, is_copper is restricted to 0/1 and total device weight is minimized.
material_weight_optimization = false
capacitor_energy_density_j_per_g = 0.85

[variable_prefixes]
; Prefix values must not include '$' or a stage suffix such as '_1'.
inner_diameter = coil_inner_Diameter
outer_diameter = coil_outer_Diameter
length = coil_Len
turns = Turn
fill_factor = fill_factor
rho = rho
is_copper = is_copper
gap = gap
z_start = z_start
r_dc = coil_R
coil_center = coil_center
pos_on = POSon
pos_dur = POSdur
; Dimensionless POSon optimization factor used by both position modes.
position_factor = u
capacitance = C
esr = ESR
initial_voltage = V
; Last-stage diode return resistor (shared, no stage suffix).
last_resistance = Rlast

[circuit]
; Supported values: single_boost, odd_even_boost, film_capacitor_scr.
topology = single_boost

[initial_values]
pos_on = 0mm
; Stage 1 uses a fixed pre-trigger position and is excluded from position optimization.
first_stage_pos_on = -1000mm
pos_dur = 10mm
; Nominal u value. Bounds: reluctance -0.2..1.2, induction -0.3..1.6.
position_factor = 0.5
capacitance = 220uF
initial_voltage = 390V
esr = 400mOhm
last_resistance = 1ohm

[voltage_controlled_switch]
model_name = SW_Model_Common
Ron = 0.001ohm
Roff = 1000000ohm
Von = 0.9*$V
Voff = 0.1*$V

[vpulse]
V1 = 0V
V2 = 1.25*$V
Tr = 0
Tf = 0
Period = 1e9mm
shunt_resistance = 10000ohm

[vpwl]
fall_delta = 0.01mm
end_position = 1e9mm

[diode]
model_name = DIODE_Model_Common
; Native AEDT 2024 R2 DIODE_Model defaults, verified with PyAEDT 0.25.0.
; A blank value keeps the installed AEDT library default for that property.
IS = 1e-14A
RS = 0ohm
N = 1
EG = 1.11V
XTI = 3
BV = 1e+30V
IBV = 0.001A
TNOM = 27
